services:
  postgres:
    image: postgres:16-alpine
    container_name: kronoflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kronoflow
    ports:
      - "5432:5432"
    volumes:
      - kronoflow_pgdata:/var/lib/postgresql/data

volumes:
  kronoflow_pgdata:
